; Shared by every ESP32 device build. A new display or provider gets its own env that
; extends this and picks its folders in build_src_filter (see README).
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.4.3

; Waveshare 2.9" e-paper + MVV.
[env:esp32dev]
extends = esp32_base
build_src_filter = +<main.cpp> +<view/epaper_290/> +<provider/mvv/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps = bblanchon/ArduinoJson@^7.4.3
