; Shared by every ESP32 device build. VIEW / PROVIDER environment variables override the
; defaults below, e.g. `VIEW=epaper_290 PROVIDER=mvv pio run -e esp32dev` (see README).
[esp32_base]
platform = espressif32@8.0.0
board = esp32dev
; Arduino core 3.x outgrows the default 1.25 MB app partition; this one keeps both OTA slots.
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.4.3
extra_scripts = pre:scripts/select_modules.py
custom_view = epaper_290
custom_provider = mvv

[env:esp32dev]
extends = esp32_base

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps = bblanchon/ArduinoJson@^7.4.3
